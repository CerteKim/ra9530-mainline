PACKAGE_NAME="ra9530"
PACKAGE_VERSION="1.0"

# 源码里驱动在 driver/ 子目录，所以要显式给出 MAKE/CLEAN。
# DKMS 会把整棵树复制到 ${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/，
# 因此这里的路径必须按那个布局写（已实测可用）。
MAKE[0]="make -C ${kernel_source_dir} M=${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/driver modules"
CLEAN="make -C ${kernel_source_dir} M=${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/driver clean"

BUILT_MODULE_NAME[0]="ra9530-charger"
DEST_MODULE_NAME[0]="ra9530-charger"
DEST_MODULE_LOCATION[0]="/updates/dkms"

AUTOINSTALL="yes"
