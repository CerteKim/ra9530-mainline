PACKAGE_NAME="ra9530"
PACKAGE_VERSION="1.0.3"

# 源码里驱动在 driver/ 子目录，所以要显式给出 MAKE/CLEAN。
# DKMS 把 /usr/src/ra9530-1.0.3/ 整个复制到
# ${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build/ 再在那里编译
# （dkms 3.4.3 的 do_build()：CP -a "$source_dir/" "$build_dir"），
# 所以路径里必须有 build/ —— 少了它 make 会直接报
#   *** specified external module directory "..." does not exist.
MAKE[0]="make -C ${kernel_source_dir} M=${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build/driver modules"
CLEAN="make -C ${kernel_source_dir} M=${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build/driver clean"

BUILT_MODULE_NAME[0]="ra9530-charger"
DEST_MODULE_NAME[0]="ra9530-charger"
DEST_MODULE_LOCATION[0]="/updates/dkms"

AUTOINSTALL="yes"
