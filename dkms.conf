PACKAGE_NAME="ra9530"
PACKAGE_VERSION="1.0.5"

# 源码里驱动在 driver/ 子目录，所以要显式给出 MAKE。
# DKMS 把 /usr/src/ra9530-1.0.5/ 整个复制到
# ${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build/ 再在那里编译
# （dkms 3.4.3 的 do_build()：CP -a "$source_dir/" "$build_dir"），
# 所以路径里必须有 build/ —— 少了它 make 会直接报
#   *** specified external module directory "..." does not exist.
MAKE[0]="make -C ${kernel_source_dir} M=${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build/driver modules"

# 模块编在 build/driver/ 下，而 DKMS 是在 build/ 里按相对路径找 .ko 的
# （dkms 3.4.3 do_build() 编译完用 ${built_module_location}${built_module_name}.ko
# 检查，不做递归查找），少了这一行编译明明成功却会报：
#   Error! Build of ra9530-charger.ko failed ...
#   Make sure the name and location of the generated module are correct
# 末尾的 / 由 DKMS 自己补上。
BUILT_MODULE_LOCATION[0]="driver"

BUILT_MODULE_NAME[0]="ra9530-charger"
DEST_MODULE_NAME[0]="ra9530-charger"
DEST_MODULE_LOCATION[0]="/updates/dkms"

# 不要再写 CLEAN：dkms 3.x 每次构建前自己 rm -rf build_dir，CLEAN 已弃用，
# 写了只会打印一行 "Deprecated feature: CLEAN"。

AUTOINSTALL="yes"
